# memjudge v2 的 cordis 补丁：把插件挂进 profile。
#
# 这里只放**非敏感**配置。密钥不进这个文件，也不进 git：
#   写到 <DSH_HOME>/memjudge/secrets.json → {"chatKey":"...","embedKey":"...","rerankKey":"..."}
#   或注入环境变量 MEMJUDGE_CHAT_KEY / MEMJUDGE_EMBED_KEY / MEMJUDGE_RERANK_KEY。
# 无密钥时插件 100% 离线工作：双边闭合轮走本地规则脱水，检索走 BM25 + entity_slots RRF 融合。
- insert:
    - id: memjudge
      name: 'dsh-memjudge'
      config:
        # v2 保 Prefix KV Cache 两段式动态注入（生产环境默认开启）
        autoInject: true
        injectMode: tiered
        # Tier-S 冻结热底座 <= 600 chars，Tier-D 按问动态召回 <= 900 chars，单步合计 <= 1500 chars
        tierSBudget: 600
        tierDBudget: 900
        injectBudget: 1500
        # 双边闭合轮采集与异步脱水默认开启
        autoCapture: true
        # 实验性逐日注入排序（legacy / daily 兼容配置）
        experimentalInjectMode: legacy
        experimentalInjectHalfLifeDays: 30
        experimentalInjectFloor: 0.1
        # 衰减模式与半衰期
        decayMode: dual
        halfLifeDays: 30
        touchOnRecall: true
        # 在线检索增强模块（需配置对应组 API Key 后开启）
        vector: false
        rerank: false
        expand: false
        llmSelect: false
